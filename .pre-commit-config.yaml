repos:
  # -------------------------
  # Python backend
  # -------------------------

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix]

      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^backend/

  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: pytest backend
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false